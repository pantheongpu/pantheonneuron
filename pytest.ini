[pytest]
pythonpath = .
testpaths = tests

# --strict-markers: an unregistered marker is an error, not a silent no-op.
#   A typo'd @pytest.mark.skipif_on_hardware attaches nothing and the test
#   runs unconditionally, which looks exactly like a test that passed.
# --strict-config: an unknown key in this file is an error rather than
#   being ignored, so a setting that never took effect cannot look applied.
addopts = --strict-markers --strict-config

# Warnings are errors.
#
# A SyntaxWarning for an invalid escape sequence was introduced into
# kernels/collectives.py on 2026-09-10 and reached a commit. pytest printed
# it, the suite stayed green -- it was caught by reading the terminal,
# which is not a check.
#
# Reintroducing that exact defect with `error` set turns it into a
# SyntaxError at collection and exits 2, but **only with cold bytecode**.
# A compile-time warning is emitted when a module is compiled, not when a
# cached .pyc is loaded, so a warm __pycache__ hides it -- which is
# precisely why it was missed locally after the first run.
#
# CI checks out fresh and is always cold, so the guard holds there. To
# reproduce CI locally, `make clean test` rather than `make test`.
#
# The escapes worth naming rather than blanket-ignoring:
#
#   default::DeprecationWarning:torch_xla
#     torch_xla deprecates xm.mark_step in favour of torch_xla.sync, and
#     every kernel calls it. That is a real migration and it belongs in a
#     commit of its own rather than as a condition of running the tests --
#     but it is a *warning* here, not an error, so the day it is done this
#     line is what will start failing and say so.
filterwarnings =
    error
    default::DeprecationWarning:torch_xla
    default::DeprecationWarning:torch_xla.core.xla_model
